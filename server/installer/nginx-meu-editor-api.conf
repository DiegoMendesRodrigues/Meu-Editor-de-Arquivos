# Exemplo de proxy reverso HTTPS (nginx). Troque api.exemplo.com e os caminhos dos certificados.
server {
    listen 443 ssl;
    http2 on;
    server_name api.exemplo.com;

    ssl_certificate     /etc/letsencrypt/live/api.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.exemplo.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.exemplo.com;
    return 301 https://$host$request_uri;
}
