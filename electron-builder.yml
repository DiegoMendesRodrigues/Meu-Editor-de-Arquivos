# Desenvolvido por Diego Mendes Rodrigues - https://www.linkedin.com/in/diegomendesrodrigues/
appId: com.meueditor.app
productName: Meu Editor de Arquivos
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - build/icon.ico
  - build/icon.png
asarUnpack: []
win:
  target:
    - nsis
    - portable
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - deb
    - AppImage
  category: Development
  maintainer: Diego Mendes Rodrigues
