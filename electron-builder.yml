# Desenvolvido por Diego Mendes Rodrigues - https://www.linkedin.com/in/diegomendesrodrigues/
appId: com.meueditor.app
productName: Meu Editor de Arquivos
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - build/icon.ico
  - build/icon.png
extraResources:
  # Manuais do usuário (um por idioma): só o HTML e as imagens, sem os textos-fonte
  - from: docs/manual
    to: manual
    filter:
      - '*/index.html'
      - '*/img/**'
asarUnpack: []
win:
  target:
    - nsis
    - portable
  artifactName: ${name}-${version}-${arch}.${ext}
portable:
  artifactName: ${name}-portable-${version}-${arch}.${ext}
# Pacote para a Microsoft Store (npm run dist:store). Os valores de identidade vêm do Partner Center:
# Produtos → Meu Editor de Arquivos → Identidade do produto. ID da Store: 9P9LZ413B1XL.
appx:
  applicationId: MeuEditorDeArquivos
  identityName: DiegoMendesRodrigues.MeuEditordeArquivos  # Package/Identity/Name
  publisher: CN=9B7A62C5-2D2E-42C3-AEAC-C3C5FFA0E614      # Package/Identity/Publisher
  publisherDisplayName: Diego Mendes Rodrigues        # Package/Properties/PublisherDisplayName
  displayName: Meu Editor de Arquivos
  backgroundColor: transparent
  showNameOnTiles: true
  # Idiomas da página da loja e do pacote; o primeiro é o idioma padrão (português do Brasil).
  languages:
    - pt-BR
    - pt-PT
    - en-US
    - es-ES
    - fr-FR
    - de-DE
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  artifactName: ${name}-setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Ícones do aplicativo no instalador, no desinstalador e no cabeçalho das telas.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  # Telas e botões no idioma do Windows de quem instala (inglês se não for um dos seis).
  multiLanguageInstaller: true
  displayLanguageSelector: false
  installerLanguages:
    - en_US
    - pt_BR
    - pt_PT
    - es_ES
    - fr_FR
    - de_DE
linux:
  target:
    - deb
    - AppImage
  category: Development
  maintainer: Diego Mendes Rodrigues
